<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Place — Travel</title>
  <link rel="stylesheet" href="styles/place.css">
</head>
<body>
  <header class="site-header">
  <h1>Uganda</h1>
  </header>

  <section class="hero">
    <picture>
      <source srcset="images/Wildlife.png" media="(min-width:800px)" type="image/png">
      <source srcset="images/Wildlife.png" media="(min-width:480px)" type="image/png">
      <img src="images/Wildlife.png" alt="Landscape in Uganda" loading="lazy">
    </picture>
  </section>

  <main class="hero-content">

  <section class="card data-card">
    <h2>Data</h2>

    <p><strong>Area:</strong> 241,038 sq km</p>
    <p><strong>Population:</strong> 45,000,000</p>
    <p><strong>Capital:</strong> Kampala</p>
    <p><strong>Languages:</strong> English, Swahili</p>
    <p><strong>Currency:</strong> Uganda Shilling</p>
    <p><strong>Time Zone:</strong> UTC+3</p>
    <p><strong>Calling Code:</strong> +256</p>
    <p><strong>Internet TLD:</strong> .ug</p>
  </section>

  <section class="card weather-card">
    <h2 class="weather-heading">Weather</h2>

    <div class="weather">
      <p><strong>Temperature:</strong> <span id="temp">24</span> °C</p>
      <p><strong>Wind:</strong> <span id="wind">12</span> km/h</p>
      <p><strong>Wind Chill:</strong> <span id="windchill">—</span></p>
    </div>

  </section>

  </main>

  <footer class="site-footer">
    <p id="copyright">© <span id="year"></span> Example Organization</p>
    <p>Last modified: <span id="lastmod"></span></p>
  </footer>

  <script src="scripts/place.js" defer></script>
</body>
</html>
