<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive temple gallery showcasing sacred temples from around the world with clean navigation and modern design.">
  <meta name="author" content="Andrew Ssebuufu">
  <title>Temple Album</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/filtered-temples.css">

    <!-- JavaScript -->
    <script src="scripts/filtered-temples.js" defer></script>
 </head>

 <body>
 <header>
    <h1>Temple Album</h1>

    <button id="menu" aria-expanded="false" aria-controls="templesGallery" aria-label="Toggle navigation menu">☰</button>

    <nav class="navigation" aria-label="Temple filters">
        <a href="#" data-filter="all">Home</a>
        <a href="#" data-filter="old">Old</a>
        <a href="#" data-filter="new">New</a>
        <a href="#" data-filter="large">Large</a>
        <a href="#" data-filter="small">Small</a>
    </nav>
 </header>
 
  <main>
    <h2 id="page-title">Home</h2>

    <section class="gallery" id="templesGallery">
        <!-- Temple cards will be generated here by JavaScript -->
    </section>
  </main>

 

 <footer>
    <p>© <span id="year"></span> |🤗 Andrew Ssebuufu 🤗| Uganda</p>
    <p id="lastModified"></p>
 </footer>
 </body>
</html>
