<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Swimming World with questions or feedback about swimming techniques and equipment.">
    <meta name="author" content="Andrew Ssebuufu">
    <title>Swimming World - Contact</title>
    <link rel="stylesheet" href="styles/swimming.css">
</head>
<body>
    <header>
        <h1>Contact</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="techniques.html">Techniques</a>
            <a href="equipment.html">Equipment</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <form id="contactForm">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <input type="submit" value="Send">
            </form>
            <p id="savedMsg"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Andrew Ssebuufu</p>
    </footer>

    <script src="scripts/swimming.js" defer></script>
</body>
</html>
