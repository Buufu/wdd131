<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Andrew Ssebuufu">
  <title>Review Submitted – Thank You!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #faf6ef;
      --cream-dark: #f0e9dc;
      --forest: #1a3a2a;
      --forest-mid: #2c5c3f;
      --gold: #b8860b;
      --gold-light: #d4a94a;
      --text: #2a2016;
      --muted: #7a6a54;
      --border: #c8bba8;
    }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--forest);
      padding: 2rem 1.5rem 1.8rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,.03) 20px, rgba(255,255,255,.03) 21px);
    }
    header .eyebrow {
      font-size: .7rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: .5rem;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      font-weight: 900;
      color: #fff;
    }

    main { flex: 1; padding: 2.5rem 1rem 3rem; }

    .confirm-card {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(26,58,42,.07);
    }

    /* ── Checkmark badge ── */
    .badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 70px; height: 70px;
      background: var(--forest);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: popIn .4s cubic-bezier(.175,.885,.32,1.275) both;
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .badge svg { width: 32px; height: 32px; }

    .confirm-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--forest);
      text-align: center;
      margin-bottom: .5rem;
    }
    .confirm-subtitle {
      text-align: center;
      color: var(--muted);
      font-style: italic;
      font-size: .9rem;
      margin-bottom: 2rem;
    }

    /* ── Counter banner ── */
    .counter-banner {
      background: var(--forest);
      color: #fff;
      border-radius: 3px;
      padding: 1rem 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .counter-banner .count-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--gold-light);
      display: block;
      line-height: 1.1;
    }
    .counter-banner .count-label {
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .7;
      margin-top: .25rem;
      display: block;
    }

    /* ── Summary table ── */
    .section-heading {
      font-size: .7rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    .summary-table tr + tr td { border-top: 1px solid var(--cream-dark); }
    .summary-table td {
      padding: .65rem .3rem;
      vertical-align: top;
    }
    .summary-table td:first-child {
      width: 42%;
      color: var(--muted);
      font-style: italic;
      padding-right: 1rem;
    }
    .summary-table td:last-child {
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }
    .star-display { color: var(--gold); letter-spacing: .05em; }

    .divider {
      border: none;
      border-top: 1px solid var(--cream-dark);
      margin: 2rem 0;
    }

    /* ── Back button ── */
    .btn-back {
      display: block;
      width: 100%;
      padding: .85rem;
      background: transparent;
      border: 2px solid var(--forest);
      color: var(--forest);
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 3px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background .2s, color .2s;
    }
    .btn-back:hover { background: var(--forest); color: #fff; }
    .btn-back:focus { outline: 3px solid var(--gold-light); outline-offset: 2px; }

    footer {
      background: var(--forest);
      color: rgba(255,255,255,.65);
      text-align: center;
      padding: 1.4rem 1rem;
      font-size: .8rem;
      line-height: 1.8;
    }
    footer strong { color: rgba(255,255,255,.9); }

    @media (max-width: 480px) {
      .confirm-card { padding: 1.8rem 1.2rem; }
    }
  </style>
</head>
<body>

<header>
  <p class="eyebrow">Confirmation</p>
  <h1>Thank You!</h1>
</header>

<main>
  <div class="confirm-card">

    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 16L13 23L26 9" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h2 class="confirm-title">Review Submitted!</h2>
    <p class="confirm-subtitle">Your feedback has been recorded. Here's a summary of what you shared.</p>

    <!-- Review counter -->
    <div class="counter-banner" aria-live="polite">
      <span class="count-num" id="reviewCount">—</span>
      <span class="count-label">Total Reviews Submitted</span>
    </div>

    <!-- Submission summary -->
    <p class="section-heading">Your Submission</p>
    <table class="summary-table" aria-label="Submission summary">
      <tbody id="summaryBody">
      </tbody>
    </table>

    <hr class="divider" />
    <a href="form.html" class="btn-back">&#8592; Submit Another Review</a>

  </div>
</main>

<footer>
  <p><strong>&copy;2024 Product Review</strong></p>
  <p>Last Modification: <span id="lastMod"></span></p>
</footer>

<script>
  // ── Products lookup ──
  const products = [
    { id: "fc-1888", name: "Flux Capacitor" },
    { id: "fc-2050", name: "Power Laces" },
    { id: "fs-1987", name: "Time Circuits" },
    { id: "ac-2000", name: "Low Voltage Reactor" },
    { id: "jj-1969", name: "Warp Equalizer" }
  ];

  // ── Increment review counter in localStorage ──
  let count = parseInt(localStorage.getItem('reviewCount') || '0', 10) + 1;
  localStorage.setItem('reviewCount', count);
  document.getElementById('reviewCount').textContent = count;

  // ── Parse query string ──
  const params = new URLSearchParams(window.location.search);

  function getProductName(id) {
    const p = products.find(p => p.id === id);
    return p ? p.name : id || '—';
  }

  function buildStars(n) {
    const num = parseInt(n, 10);
    if (!num) return '—';
    return '★'.repeat(num) + '☆'.repeat(5 - num);
  }

  const rows = [
    { label: 'Product',      val: getProductName(params.get('productName')) },
    { label: 'Rating',       val: `<span class="star-display">${buildStars(params.get('rating'))}</span> (${params.get('rating') || '—'}/5)` },
    { label: 'Installed On', val: params.get('installDate') || '—' },
    { label: 'Features',     val: (() => {
        const f = params.getAll('features');
        return f.length ? f.join(', ') : 'None selected';
      })()
    },
    { label: 'Written Review', val: params.get('writtenReview') || '<em style="color:var(--muted)">Not provided</em>' },
    { label: 'Reviewer',     val: params.get('userName') || '<em style="color:var(--muted)">Anonymous</em>' }
  ];

  const tbody = document.getElementById('summaryBody');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.label}</td><td>${r.val}</td>`;
    tbody.appendChild(tr);
  });

  // ── Last modified ──
  const d = new Date(document.lastModified);
  document.getElementById('lastMod').textContent = d.toLocaleDateString('en-US', {
    month:'2-digit', day:'2-digit', year:'numeric'
  }) + ' ' + d.toLocaleTimeString('en-US', { hour12: false });
</script>

</body>
</html>
