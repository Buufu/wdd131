<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="js/form.js" defer></script>
</head>

<body>

 <header>
    <h1>Product Review</h1>
 </header>

 <main>

  <form method="get" action="review.html">

    <!-- Product Name -->
    <div class="form-group">
        <label for="productName">
            Product Name <span class="required">*</span>
        </label>

        <select id="productName" name="productName" required>
            <option value="" disabled selected>
                Select a Product ...
            </option>
        </select>
    </div>

    <!-- Overall Rating -->
    <div class="form-group">
        <span class="form-label">Overall Rating</span>
        <div class="rating-group">
            <label for="rating1">
                <input type="radio" id="rating1" name="rating" value="1" required>
                1 Star
            </label>
            <label for="rating2">
                <input type="radio" id="rating2" name="rating" value="2">
                2 Stars
            </label>
            <label for="rating3">
                <input type="radio" id="rating3" name="rating" value="3">
                3 Stars
            </label>
            <label for="rating4">
                <input type="radio" id="rating4" name="rating" value="4">
                4 Stars
            </label>
            <label for="rating5">
                <input type="radio" id="rating5" name="rating" value="5">
                5 Stars
            </label>
        </div>
    </div>

    <!-- Date of Installation -->
    <div class="form-group">
        <label for="installDate">
            Date of Installation
        </label>

        <input type="date" id="installDate" name="installDate" required>
    </div>

    <!-- Rating -->
    <fieldset class="form-group features">
    <legend>
        Which features did you find useful in the product?
        <br>
        <em>(Check all that apply)</em>
    </legend>

    <label for="durability">
        <input type="checkbox"
               id="durability"
               name="features"
               value="Durability">
        Durability
    </label>

    <label for="ease">
        <input type="checkbox"
               id="ease"
               name="features"
               value="Ease of Use">
        Ease of Use
    </label>

    <label for="performance">
        <input type="checkbox"
               id="performance"
               name="features"
               value="Performance">
        Performance
    </label>

    <label for="design">
        <input type="checkbox"
               id="design"
               name="features"
               value="Design">
        Design
    </label>
    </fieldset>

    <!-- Written Review -->
    <div class="form-group">
        <label for="review">
            Written Review
        </label>

        <textarea
            id="review"
            name="review"
            rows="6"></textarea>
    </div>

    <!-- User Name -->
    <div class="form-group">
        <label for="username">
            User Name
        </label>

        <input
            type="text"
            id="username"
            name="username">
    </div>

    <input
        type="submit"
        value="Post Review"
        class="submit-btn">

   </form>

 </main>

 <footer>
    <p>
        ©2026 🌺Andrew Ssebuufu 🌺 Uganda
    </p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
