<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <title>Product Review</title>

    <link rel="stylesheet" href="css/form.css">

    <script src="js/form.js" defer></script>
</head>

<body>

 <header>
    <h1>Product Review</h1>
 </header>

 <main>

  <form method="get" action="review.html">

    <!-- Product Name -->
    <div class="form-group">
        <label for="productName">
            Product Name <span class="required">*</span>
        </label>

        <select id="productName" name="productName" required>
            <option value="" disabled selected>
                Select a Product ...
            </option>
        </select>
    </div>

    <!-- Rating -->
    <fieldset class="form-group features">
    <legend>
        Which features did you find useful in the product?
        <br>
        <em>(Check all that apply)</em>
    </legend>

    <label for="durability">
        <input type="checkbox"
               id="durability"
               name="features"
               value="Durability">
        Durability
    </label>

    <label for="ease">
        <input type="checkbox"
               id="ease"
               name="features"
               value="Ease of Use">
        Ease of Use
    </label>

    <label for="performance">
        <input type="checkbox"
               id="performance"
               name="features"
               value="Performance">
        Performance
    </label>

    <label for="design">
        <input type="checkbox"
               id="design"
               name="features"
               value="Design">
        Design
    </label>
    </fieldset>

    <!-- Written Review -->
    <div class="form-group">
        <label for="review">
            Written Review
        </label>

        <textarea
            id="review"
            name="review"
            rows="6"></textarea>
    </div>

    <!-- User Name -->
    <div class="form-group">
        <label for="username">
            User Name
        </label>

        <input
            type="text"
            id="username"
            name="username">
    </div>

    <input
        type="submit"
        value="Post Review"
        class="submit-btn">

   </form>

 </main>

 <footer>
    <p>
        ©2026 🌺Andrew Ssebuufu 🌺 Uganda
    </p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
