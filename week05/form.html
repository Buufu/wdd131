<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <title>Product Review</title>

    <link rel="stylesheet" href="css/form.css">

    <script src="js/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

<form method="get" action="review.html">

    <!-- Product Name -->
    <div class="form-group">
        <label for="productName">
            Product Name <span class="required">*</span>
        </label>

        <select id="productName" name="productName" required>
            <option value="" disabled selected>
                Select a Product ...
            </option>
        </select>
    </div>

    <!-- Rating -->
    <fieldset class="form-group">
        <legend>
            Overall Rating <span class="required">*</span>
        </legend>

        <div class="rating">

            <label>
                <input type="radio" name="rating" id="rating1" value="1" required>
                ☆
            </label>

            <label>
                <input type="radio" name="rating" id="rating2" value="2">
                ☆☆
            </label>

            <label>
                <input type="radio" name="rating" id="rating3" value="3">
                ☆☆☆
            </label>

            <label>
                <input type="radio" name="rating" id="rating4" value="4">
                ☆☆☆☆
            </label>

            <label>
                <input type="radio" name="rating" id="rating5" value="5">
                ☆☆☆☆☆
            </label>

        </div>
    </fieldset>

    <!-- Date -->
    <div class="form-group">
        <label for="installDate">
            Date of Installation <span class="required">*</span>
        </label>

        <input
            type="date"
            id="installDate"
            name="installDate"
            required>
    </div>

    <!-- Features -->
    <fieldset class="form-group">
        <legend>Useful Features</legend>

        <label>
            <input type="checkbox"
                   id="durability"
                   name="features"
                   value="Durability">
            Durability
        </label>

        <label>
            <input type="checkbox"
                   id="ease"
                   name="features"
                   value="Ease of Use">
            Ease of Use
        </label>

        <label>
            <input type="checkbox"
                   id="performance"
                   name="features"
                   value="Performance">
            Performance
        </label>

        <label>
            <input type="checkbox"
                   id="design"
                   name="features"
                   value="Design">
            Design
        </label>
    </fieldset>

    <!-- Written Review -->
    <div class="form-group">
        <label for="review">
            Written Review
        </label>

        <textarea
            id="review"
            name="review"
            rows="6"></textarea>
    </div>

    <!-- User Name -->
    <div class="form-group">
        <label for="username">
            User Name
        </label>

        <input
            type="text"
            id="username"
            name="username">
    </div>

    <input
        type="submit"
        value="Post Review"
        class="submit-btn">

</form>

</main>

<footer>
    <p>
        ©2024 🌺 Rubia Magdelena Francesco 🌺 Madagascar
    </p>
    <p id="lastModified"></p>
</footer>

</body>
</html>
